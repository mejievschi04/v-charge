# v-charge.volta.md — site static V CHARGE
# Copiază pe VPS:
#   cp /var/www/app/v-charge/deploy/nginx-v-charge.volta.md.conf /etc/nginx/sites-available/v-charge-volta-md
#   ln -sf /etc/nginx/sites-available/v-charge-volta-md /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d v-charge.volta.md

server {
    listen 80;
    listen [::]:80;
    server_name v-charge.volta.md;

    root /var/www/app/v-charge;
    index index.html;

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
