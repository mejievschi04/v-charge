# v-charge.volta.md — site static V CHARGE (HTTP → HTTPS)
#
# IMPORTANT: acest fișier include SSL. Nu îl înlocui cu o variantă doar-HTTP
# după ce Certbot a emis certificatul — altfel HTTPS cade pe alt vhost (ex. Academy).
#
# Instalare / reparare pe VPS:
#   sudo cp /var/www/app/v-charge/deploy/nginx-v-charge.volta.md.conf /etc/nginx/sites-available/v-charge-volta-md
#   sudo ln -sf /etc/nginx/sites-available/v-charge-volta-md /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Dacă lipsește certificatul:
#   sudo certbot --nginx -d v-charge.volta.md

server {
    listen 80;
    listen [::]:80;
    server_name v-charge.volta.md;

    # Allow ACME challenges if certbot needs renew/reissue
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/app/v-charge;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name v-charge.volta.md;

    ssl_certificate /etc/letsencrypt/live/v-charge.volta.md/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v-charge.volta.md/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/app/v-charge;
    index index.html;

    location = /config.js {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
