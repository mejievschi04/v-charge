# Fragment pentru app.volta.md — servește V CHARGE din /var/www/app/v-charge
# Include (sau copiază) în server block-ul din:
#   /etc/nginx/sites-available/app-volta-md
# Sursa canonică a conf-ului complet: promo-app/deploy/nginx-app.volta.md.conf
#
# După update:
#   sudo nginx -t && sudo systemctl reload nginx

location = /v-charge {
    return 301 /v-charge/;
}

# ^~ ca să nu fie interceptat de regex-ul de cache pe .css/.js/.png din promo-app
location ^~ /v-charge/ {
    alias /var/www/app/v-charge/;
    index index.html;
}
